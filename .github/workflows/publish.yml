name: Publish Package

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify package
    uses: ./.github/workflows/reusable-verify.yml

  npm:
    name: npmjs.com
    runs-on: ubuntu-latest
    needs:
      - verify
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Verify release version
        if: github.event_name == 'release'
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./package.json').version")"
          release_tag="${GITHUB_REF_NAME#v}"
          if [ "${package_version}" != "${release_tag}" ]; then
            echo "package.json version ${package_version} does not match release tag ${GITHUB_REF_NAME}."
            exit 1
          fi

      - name: Build package assets
        run: npm run build

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"

          if npm view "${package_name}@${package_version}" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "${package_name}@${package_version} already exists on npm. Skipping."
            exit 0
          fi

          npm publish --access public --provenance --registry=https://registry.npmjs.org

  github-packages:
    name: GitHub Packages
    runs-on: ubuntu-latest
    needs:
      - verify
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@nordbyte"

      - name: Install dependencies
        run: npm ci

      - name: Verify release version
        if: github.event_name == 'release'
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./package.json').version")"
          release_tag="${GITHUB_REF_NAME#v}"
          if [ "${package_version}" != "${release_tag}" ]; then
            echo "package.json version ${package_version} does not match release tag ${GITHUB_REF_NAME}."
            exit 1
          fi

      - name: Build package assets
        run: npm run build

      - name: Prepare GitHub Packages manifest
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from "node:fs/promises";

          const pkg = JSON.parse(await readFile("package.json", "utf8"));
          pkg.name = "@nordbyte/repovista";
          pkg.publishConfig = {
            registry: "https://npm.pkg.github.com"
          };

          await writeFile("package.json", `${JSON.stringify(pkg, null, 2)}\n`, "utf8");
          NODE

      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"

          if npm view "${package_name}@${package_version}" version --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "${package_name}@${package_version} already exists on GitHub Packages. Skipping."
            exit 0
          fi

          npm publish --ignore-scripts --registry=https://npm.pkg.github.com
