name: Publish Package

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      version:
        description: "Expected package version, with or without leading v"
        required: false
        type: string
      publish_npmjs:
        description: "Publish repovista to npmjs.com"
        required: true
        type: boolean
        default: true
      publish_github_packages:
        description: "Publish @nordbyte/repovista to GitHub Packages"
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify package
    uses: ./.github/workflows/reusable-verify.yml

  npm:
    name: npmjs.com
    if: ${{ github.event_name == 'release' || inputs.publish_npmjs }}
    runs-on: ubuntu-latest
    needs:
      - verify
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Verify release version
        env:
          EXPECTED_VERSION: ${{ github.event_name == 'release' && github.ref_name || inputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${EXPECTED_VERSION}" ]; then
            echo "No expected version was provided for this manual publish."
            exit 1
          fi
          package_version="$(node -p "require('./package.json').version")"
          expected_version="${EXPECTED_VERSION#v}"
          if [ "${package_version}" != "${expected_version}" ]; then
            echo "package.json version ${package_version} does not match requested version ${EXPECTED_VERSION}."
            exit 1
          fi

      - name: Build package assets
        run: npm run build

      - name: Publish to npm
        run: |
          set -euo pipefail
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"

          if npm view "${package_name}@${package_version}" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "${package_name}@${package_version} already exists on npm. Skipping."
            exit 0
          fi

          npm publish --registry=https://registry.npmjs.org

  github-packages:
    name: GitHub Packages
    if: ${{ github.event_name == 'release' || inputs.publish_github_packages }}
    runs-on: ubuntu-latest
    needs:
      - verify
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@nordbyte"

      - name: Install dependencies
        run: npm ci

      - name: Verify release version
        env:
          EXPECTED_VERSION: ${{ github.event_name == 'release' && github.ref_name || inputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${EXPECTED_VERSION}" ]; then
            echo "No expected version was provided for this manual publish."
            exit 1
          fi
          package_version="$(node -p "require('./package.json').version")"
          expected_version="${EXPECTED_VERSION#v}"
          if [ "${package_version}" != "${expected_version}" ]; then
            echo "package.json version ${package_version} does not match requested version ${EXPECTED_VERSION}."
            exit 1
          fi

      - name: Build package assets
        run: npm run build

      - name: Prepare GitHub Packages manifest
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from "node:fs/promises";

          const pkg = JSON.parse(await readFile("package.json", "utf8"));
          pkg.name = "@nordbyte/repovista";
          pkg.publishConfig = {
            registry: "https://npm.pkg.github.com"
          };

          await writeFile("package.json", `${JSON.stringify(pkg, null, 2)}\n`, "utf8");
          NODE

      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"

          if npm view "${package_name}@${package_version}" version --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "${package_name}@${package_version} already exists on GitHub Packages. Skipping."
            exit 0
          fi

          npm publish --ignore-scripts --registry=https://npm.pkg.github.com
